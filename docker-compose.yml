# docker-compose.yml
services:
  db:
    image: postgres:latest
    container_name: task_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"

  backend:
    build: 
      context: ./backend
    container_name: task_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: 
      context: ./frontend
    container_name: task_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: