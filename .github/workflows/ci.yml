name: Python CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # === ТОТ САМЫЙ ОБЩИЙ "ENV" ДЛЯ ВСЕГО ПАЙПЛАЙНА ===
    # Эти переменные будут доступны КАЖДОМУ шагу (step) ниже
    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-dummy-secret-key-123
      DJANGO_DEBUG: False
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_CORS_ORIGINS: http://localhost:5173

    # Поднимаем БД для тестов
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend # Все команды выполняем в папке бэкенда

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip' # Ускоряет установку зависимостей

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Устанавливаем инструменты для CI
        pip install black isort mypy pytest pytest-django coverage django-stubs djangorestframework-stubs

    - name: Run black
      run: black --check .

    - name: Run isort
      run: isort --check-only .

    - name: Run mypy
      run: mypy .

    - name: Run tests with coverage
      run: |
        coverage run -m pytest
        coverage report --fail-under=80
        coverage xml

    - name: Run Bandit (Security Check)
      run: bandit -r . -x ./venv,./tests